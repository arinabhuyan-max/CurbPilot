<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<link rel="icon" href="/parker.svg">
<title>CurbPilot</title>
<style>
  :root {
    --bg: #fff7ec; --card: #ffffff; --text: #1b1735; --muted: #645e7d; --line: #efe2cf;
    --accent: #5b3df5; --accent-2: #ffc928; --accent-text: #ffffff; --shadow: 0 6px 24px rgba(60, 40, 120, .10);
    --go: #0b8a4c; --go-bg: #def7e8; --load: #2457d6; --load-bg: #e3ecff;
    --warn: #b4410b; --warn-bg: #ffeedd; --stop: #c81e43; --stop-bg: #ffe6eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14112a; --card: #1f1a3b; --text: #f4f1ff; --muted: #b5addb; --line: #342d5c;
      --accent: #8d7bff; --accent-2: #ffd34d; --accent-text: #120f26; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
      --go: #46e08f; --go-bg: #11331f; --load: #86aeff; --load-bg: #18264b;
      --warn: #ffb562; --warn-bg: #3b2513; --stop: #ff86a0; --stop-bg: #3d1422;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 14px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; font-weight: 800; }
  h1 span { background: linear-gradient(transparent 62%, var(--accent-2) 62%); }
  header small { color: var(--muted); font-size: 14px; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }

  /* Parker */
  .parker { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
  .parker img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--accent-2); }
  .parker.talking img { animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px) scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { .parker.talking img { animation: none; } }
  .bubble { position: relative; background: var(--bg); border-radius: 16px; padding: 10px 12px; font-weight: 600; }
  .bubble::before { content: ""; position: absolute; left: -8px; top: 22px; border: 8px solid transparent; border-left: 0; border-right-color: var(--bg); }
  .voice { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  .talk {
    flex: 1; min-height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 18px; font-weight: 800;
    background: var(--accent-2); color: #1b1735; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .talk.on { background: var(--stop); color: #fff; }
  .talk svg { width: 22px; height: 22px; }
  .voice-status { grid-column: 1 / -1; color: var(--muted); font-size: 14px; margin: 0; }
  .voice-status:empty { display: none; }

  label { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
  input, select {
    width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--bg);
    border: 2px solid var(--line); border-radius: 14px; padding: 12px; min-height: 52px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  select { appearance: none; -webkit-appearance: none; padding-right: 40px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 20px center, right 14px center; background-size: 6px 6px; background-repeat: no-repeat; }
  .field { margin-top: 12px; }
  button[type=submit] {
    width: 100%; margin-top: 14px; min-height: 56px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-text); font: inherit; font-size: 19px; font-weight: 800;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .15);
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; }
  .recent { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .recent button { font: inherit; font-size: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px; }
  .result { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
  .verdict { padding: 14px 16px; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
  .v-go { background: var(--go-bg); color: var(--go); }
  .v-load { background: var(--load-bg); color: var(--load); }
  .v-nearby { background: var(--warn-bg); color: var(--warn); }
  .v-none, .v-error { background: var(--stop-bg); color: var(--stop); }
  .v-outside { background: var(--bg); color: var(--muted); }
  .body { padding: 16px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .summary { font-size: 20px; line-height: 1.4; font-weight: 700; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin: 20px 0 8px; font-weight: 800; }
  ul, ol { margin: 0; padding: 0; list-style: none; }
  li { padding: 12px 14px; border-radius: 14px; margin-bottom: 8px; font-size: 16px; }
  li b { display: block; font-size: 14px; }
  .alt li { background: var(--bg); border-left: 5px solid var(--accent-2); }
  .caveats { color: var(--muted); font-size: 13px; }
  .caveats li { padding: 2px 0; margin: 0; }
  footer { color: var(--muted); font-size: 13px; margin-top: 18px; text-align: center; }
  .cam { margin: 0; }
  .cam img {
    display: block; width: 100%; height: auto; aspect-ratio: 640 / 352; object-fit: cover;
    border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
  }
  .cam img.stale { opacity: .4; }
  .cam figcaption { margin: 6px 0 0; }
  .camnav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
  .camnav button { font: inherit; font-size: 15px; font-weight: 700; border: 2px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; min-height: 44px; padding: 0 16px; }
  .camnav a { color: var(--accent); font-size: 15px; }
</style>
</head>
<body>
<main>
  <header><h1><span>CurbPilot</span></h1><small>Where can my van stop?</small></header>
  <div id="demo" class="banner" hidden>Demo mode: sample signs, not real NYC data. Don't use for real deliveries.</div>

  <section class="card parker" id="parker">
    <img id="parkerImg" src="/parker.svg" alt="Parker, the CurbPilot assistant" width="76" height="76">
    <div class="bubble" id="parkerSay">Hi, I'm Parker! Tell me where you're delivering and I'll find you a legal spot.</div>
    <div class="voice" id="voiceRow" hidden>
      <button type="button" class="talk" id="talk" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="talkLabel">Talk to Parker</span>
      </button>
    </div>
    <p class="voice-status" id="voiceStatus" aria-live="polite"></p>
  </section>

  <form id="form" class="card" autocomplete="on">
    <label for="address">Delivery address</label>
    <input id="address" name="address" placeholder="e.g. 120 W 28th St" required enterkeyhint="go" autocapitalize="words">
    <div class="field">
      <label for="time">Arriving</label>
      <select id="time" name="time"><option value="now">Now</option></select>
    </div>
    <button type="submit" id="go">Check the curb</button>
    <div class="recent" id="recent"></div>
  </form>

  <section id="out" aria-live="polite"></section>
  <footer id="area"></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const VERDICT = {
    go: 'Legal parking here', load: 'OK to stop for a delivery', nearby: 'Not on this block, try nearby',
    none: 'No legal spot nearby', outside: 'Outside coverage area', error: 'Problem',
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function recent() { try { return JSON.parse(localStorage.getItem('curbpilot.recent') || '[]'); } catch { return []; } }
  function remember(addr) {
    try { localStorage.setItem('curbpilot.recent', JSON.stringify([addr, ...recent().filter((a) => a !== addr)].slice(0, 5))); } catch {}
    drawRecent();
  }
  function drawRecent() {
    $('recent').innerHTML = recent().map((a) => `<button type="button" data-a="${esc(a)}">${esc(a)}</button>`).join('');
  }
  $('recent').addEventListener('click', (e) => {
    const a = e.target.dataset && e.target.dataset.a;
    if (a) { $('address').value = a; $('form').requestSubmit(); }
  });

  // Arrival choices: "Now", then every 15 minutes for the next 24 hours, in NYC time.
  // A list (not a time picker) so a half-entered time can never block the check.
  function fillTimes() {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
    }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    // Treat NYC wall-clock time as UTC so we can step through it without DST surprises.
    const now = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    const today = new Date(now).getUTCDate();
    const first = Math.ceil((now + 60000) / 900000) * 900000;
    const pad = (n) => String(n).padStart(2, '0');
    const opts = ['<option value="now">Now</option>'];
    for (let t = first; t < now + 864e5; t += 900000) {
      const d = new Date(t);
      const h = d.getUTCHours(), m = d.getUTCMinutes();
      const label = `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}${d.getUTCDate() !== today ? ' tomorrow' : ''}`;
      const value = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(h)}:${pad(m)}`;
      opts.push(`<option value="${value}">${label}</option>`);
    }
    const keep = $('time').value;
    $('time').innerHTML = opts.join('');
    if ([...$('time').options].some((o) => o.value === keep)) $('time').value = keep;
  }
  fillTimes();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fillTimes(); });

  function list(title, cls, items, numbered) {
    if (!items || !items.length) return '';
    const tag = numbered ? 'ol' : 'ul';
    return `<h2>${title}</h2><${tag} class="${cls}">${items.map((x, i) =>
      `<li><b>${numbered ? `${i + 1}. ` : ''}${esc(x.label.charAt(0).toUpperCase() + x.label.slice(1))}${x.distance ? ` · ${esc(x.distance)}` : ''}</b>${esc(x.text)}</li>`).join('')}</${tag}>`;
  }

  // ---- Live camera near the address ----
  // Public NYC DOT snapshots change every few seconds; fetch a new one every 5 s
  // while the page is visible, one request at a time. If the city's server won't
  // hand a camera's image to this page, use our /api/camera/<id>/image relay for
  // that camera, and try the direct image again on the next check.
  const CAM_REFRESH_MS = 5000;
  const CAM_MAX_FAILS = 5;
  const CAM_RETRY_MS = 30000;
  const cam = { list: [], i: 0, timer: null, gen: 0, loading: false, fails: 0 };

  function cameraSection(cams) {
    if (!cams) return '';
    if (!cams.length) return '<h2>Live camera</h2><p class="meta">No public traffic camera within 1.5 km of this address.</p>';
    return `<h2>Live camera near this address</h2>
      <figure class="cam" aria-live="off"><img id="camImg" alt="" width="640" height="352"><figcaption id="camCap" class="meta">Loading camera…</figcaption></figure>
      <div class="camnav">${cams.length > 1 ? '<button type="button" id="camNext"></button>' : ''}<a id="camOpen" target="_blank" rel="noopener noreferrer">Open full size</a></div>
      <p class="meta">Shows the area around the camera, not a specific parking spot. Public NYC DOT traffic camera.</p>`;
  }

  function stopCam() { clearTimeout(cam.timer); cam.timer = null; }

  function schedule(ms) { stopCam(); cam.timer = setTimeout(tick, ms); }

  function tick() {
    cam.timer = null;
    if (document.hidden) return; // resumed by the visibilitychange handler
    loadFrame();
  }

  function setCaption(c, text) {
    $('camCap').textContent = `${c.name} · ${c.distance} away · ${text}`;
  }

  function loadFrame() {
    const c = cam.list[cam.i];
    if (!c || !$('camImg') || cam.loading) return;
    const gen = cam.gen; // a newer check or camera switch makes this frame stale
    const url = c.useProxy ? c.proxyUrl : c.imageUrl;
    const frame = new Image();
    cam.loading = true;
    frame.onload = () => {
      if (gen !== cam.gen || !$('camImg')) return;
      cam.loading = false;
      cam.fails = 0;
      // Swap in the loaded image itself: re-setting src would download it again.
      const old = $('camImg');
      frame.id = 'camImg';
      frame.width = 640;
      frame.height = 352;
      frame.alt = old.alt;
      old.replaceWith(frame);
      $('camOpen').href = url.split('?')[0];
      const at = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      setCaption(c, `image loaded ${at}`);
      schedule(CAM_REFRESH_MS);
    };
    frame.onerror = () => {
      if (gen !== cam.gen || !$('camImg')) return;
      cam.loading = false;
      if (!c.useProxy) {
        c.useProxy = true; // this camera only
        return loadFrame();
      }
      $('camImg').classList.add('stale');
      setCaption(c, 'camera image unavailable right now');
      schedule(++cam.fails >= CAM_MAX_FAILS ? CAM_RETRY_MS : CAM_REFRESH_MS);
    };
    frame.src = `${url}?t=${Date.now()}`;
  }

  function showCam(i) {
    const c = cam.list[i];
    stopCam();
    cam.i = i;
    cam.gen++;
    cam.loading = false;
    cam.fails = 0;
    $('camImg').alt = `Traffic camera view at ${c.name}`;
    $('camImg').removeAttribute('src');
    $('camImg').classList.remove('stale');
    setCaption(c, 'loading…');
    $('camOpen').href = c.imageUrl;
    if ($('camNext')) $('camNext').textContent = `Show another camera (${i + 1} of ${cam.list.length})`;
    loadFrame();
  }

  function startCam(list) {
    stopCam();
    cam.gen++;
    cam.loading = false;
    cam.list = list || [];
    if (!cam.list.length || !$('camImg')) return;
    if ($('camNext')) $('camNext').addEventListener('click', () => showCam((cam.i + 1) % cam.list.length));
    showCam(0);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cam.list.length && $('camImg') && !cam.timer && !cam.loading) loadFrame();
  });

  function render(r) {
    const v = r.error ? 'error' : r.verdict;
    let html = `<div class="result"><div class="verdict v-${v}">${VERDICT[v] || v}</div><div class="body">`;
    if (r.error) {
      html += `<p class="summary">${esc(r.error)}</p>`;
    } else {
      html += `<div class="meta">${esc(r.address || '')}${r.when ? ` · ${esc(r.when)}` : ''}</div>`;
      html += `<p class="summary">${esc(r.summary)}</p>`;
      html += cameraSection(r.cameras);
      html += list('If that spot is full, try', 'alt', r.backups, true);
      if (r.caveats) html += `<h2>Good to know</h2><ul class="caveats">${r.caveats.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`;
    }
    $('out').innerHTML = html + '</div></div>';
    startCam(r.error ? [] : r.cameras);
  }

  // Parker's one-line reaction to each answer (the full answer is in the card).
  const PARKER_SAYS = {
    go: 'Good news: there is legal parking right on this block.',
    load: 'You can stop here to make the delivery, but only while loading.',
    nearby: 'Not on this block, but there is a legal spot a short walk away.',
    none: 'Heads up: nothing legal nearby right now. See when it opens up.',
    outside: "I don't have sign data for that address.",
    error: "Hmm, I couldn't check that one.",
  };

  async function runCheck(address, when) {
    $('go').disabled = true; $('go').textContent = 'Checking…';
    try {
      const q = new URLSearchParams({ address, when });
      const res = await fetch(`/api/check?${q}`);
      const r = await res.json();
      render(r);
      if (!voice.active) $('parkerSay').textContent = PARKER_SAYS[r.error ? 'error' : r.verdict] || PARKER_SAYS.error;
      if (!r.error) remember(address);
      $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch {
      render({ error: 'No connection. Read the signs before you stop.' });
    } finally {
      $('go').disabled = false; $('go').textContent = 'Check the curb';
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const address = $('address').value.trim();
    if (address) runCheck(address, $('time').value);
  });

  // ---- Parker's voice (Vapi) ----
  // The SDK loads only when the driver taps "Talk to Parker". Parker hears the
  // address, runs check_curb on our server, and speaks the answer; the same
  // check is shown on screen when Vapi tells the page about the tool call.
  const VAPI_SDK = 'https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.7.1/+esm';
  const voice = { config: null, vapi: null, active: false, starting: false };

  const setVoiceStatus = (t) => { $('voiceStatus').textContent = t; };
  const setTalking = (on) => $('parker').classList.toggle('talking', on);
  function setTalkButton() {
    const busy = voice.active || voice.starting;
    $('talk').classList.toggle('on', busy);
    $('talk').setAttribute('aria-pressed', String(busy));
    $('talkLabel').textContent = voice.starting ? 'Connecting…' : voice.active ? 'End call' : 'Talk to Parker';
  }
  function voiceStopped(status) {
    voice.active = false;
    voice.starting = false;
    setTalking(false);
    setTalkButton();
    setVoiceStatus(status);
  }

  function toolArgs(tc) {
    const fn = tc.function || {};
    let args = fn.arguments ?? tc.arguments ?? tc.parameters ?? {};
    if (typeof args === 'string') { try { args = JSON.parse(args); } catch { args = {}; } }
    return { name: fn.name || tc.name, args: args || {} };
  }

  function onVoiceMessage(m) {
    if (m.type === 'transcript' && m.transcriptType === 'final' && m.transcript) {
      $('parkerSay').textContent = m.role === 'assistant' ? m.transcript : `You: "${m.transcript}"`;
    }
    if (m.type === 'tool-calls') {
      for (const tc of m.toolCallList || m.toolCalls || []) {
        const { name, args } = toolArgs(tc);
        if (name === 'check_curb' && args.address) {
          $('address').value = args.address;
          runCheck(args.address, /^\d{1,2}:\d{2}$/.test(args.arrival_time || '') ? args.arrival_time : 'now');
        }
      }
    }
  }

  async function getVapi() {
    if (voice.vapi) return voice.vapi;
    const mod = await import(VAPI_SDK);
    let Vapi = mod.default;
    if (Vapi && typeof Vapi !== 'function' && Vapi.default) Vapi = Vapi.default;
    const vapi = new Vapi(voice.config.publicKey);
    vapi.on('call-start', () => {
      voice.active = true;
      voice.starting = false;
      setTalkButton();
      setVoiceStatus('Listening. Tap again to end the call.');
    });
    vapi.on('call-end', () => voiceStopped('Call ended.'));
    vapi.on('speech-start', () => setTalking(true));
    vapi.on('speech-end', () => setTalking(false));
    vapi.on('message', onVoiceMessage);
    vapi.on('error', (e) => {
      console.error('Vapi error', e);
      voiceStopped("Parker couldn't connect. Check microphone permission and try again.");
    });
    voice.vapi = vapi;
    return vapi;
  }

  $('talk').addEventListener('click', async () => {
    if (voice.active || voice.starting) {
      if (voice.vapi) voice.vapi.stop();
      return voiceStopped('Call ended.');
    }
    voice.starting = true;
    setTalkButton();
    setVoiceStatus('Connecting to Parker… allow the microphone if asked.');
    try {
      const vapi = await getVapi();
      const call = await vapi.start(voice.config.assistant);
      if (!call && !voice.active) voiceStopped("Parker couldn't start the call. Try again in a moment.");
    } catch (err) {
      console.error(err);
      voiceStopped("Parker couldn't start. Check your connection and microphone permission.");
    }
  });

  fetch('/api/voice').then((r) => r.json()).then((v) => {
    if (!v.enabled) return;
    voice.config = v;
    $('voiceRow').hidden = false;
    $('parkerSay').textContent = "Hi, I'm Parker! Tap the button and tell me the delivery address, or type it below.";
  }).catch(() => {});

  fetch('/api/info').then((r) => r.json()).then((i) => {
    $('demo').hidden = !i.demo;
    if (i.parkerImage) $('parkerImg').src = i.parkerImage;
    $('area').textContent = `Covers ${i.area}. Fewer tickets, not guaranteed open spots.`;
  }).catch(() => {});
  drawRecent();
</script>
</body>
</html>
