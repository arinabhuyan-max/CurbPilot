<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Parker">
  <!-- Parker: a little flying delivery van with goggles, matching the CurbPilot flyer. -->
  <circle cx="60" cy="60" r="60" fill="#232a4a"/>

  <!-- sparkles and speed lines -->
  <path d="M99 20 q1.2 5 6 6 q-4.8 1 -6 6 q-1.2 -5 -6 -6 q4.8 -1 6 -6z" fill="#ecbdcd"/>
  <path d="M21 27 q.8 3 3.5 3.5 q-2.7 .5 -3.5 3.5 q-.8 -3 -3.5 -3.5 q2.7 -.5 3.5 -3.5z" fill="#dfe7f5"/>
  <path d="M10 73h9M13 79h6" stroke="#8a93ad" stroke-width="3" stroke-linecap="round"/>

  <!-- shadow -->
  <ellipse cx="60" cy="98" rx="31" ry="3.5" fill="#161b33"/>

  <!-- wings -->
  <ellipse cx="23" cy="57" rx="11" ry="4.5" transform="rotate(-12 23 57)" fill="#fff" stroke="#b8cbe8" stroke-width="1.5"/>
  <ellipse cx="97" cy="57" rx="11" ry="4.5" transform="rotate(12 97 57)" fill="#fff" stroke="#b8cbe8" stroke-width="1.5"/>

  <!-- body -->
  <rect x="30" y="38" width="60" height="50" rx="14" fill="#cfdcf0"/>
  <path d="M30 76h60v4a8 8 0 0 1 -8 8h-44a8 8 0 0 1 -8 -8z" fill="#b8cbe8"/>

  <!-- cap with goggles -->
  <path d="M38 41 q0 -15 22 -15 q22 0 22 15z" fill="#ecbdcd"/>
  <rect x="35" y="36" width="50" height="7" rx="3.5" fill="#e6a9bf"/>
  <circle cx="60" cy="25" r="2.6" fill="#fff" stroke="#232a4a" stroke-width="1.2"/>
  <circle cx="51" cy="38" r="5.5" fill="#fff" stroke="#232a4a" stroke-width="2.4"/>
  <circle cx="69" cy="38" r="5.5" fill="#fff" stroke="#232a4a" stroke-width="2.4"/>
  <circle cx="49.5" cy="36.5" r="1.4" fill="#cfdcf0"/>
  <circle cx="67.5" cy="36.5" r="1.4" fill="#cfdcf0"/>

  <!-- face -->
  <circle cx="50" cy="56" r="4.5" fill="#232a4a"/>
  <circle cx="70" cy="56" r="4.5" fill="#232a4a"/>
  <circle cx="51.6" cy="54.4" r="1.5" fill="#fff"/>
  <circle cx="71.6" cy="54.4" r="1.5" fill="#fff"/>
  <ellipse cx="42.5" cy="64" rx="4" ry="2.4" fill="#f2b6c6"/>
  <ellipse cx="77.5" cy="64" rx="4" ry="2.4" fill="#f2b6c6"/>
  <path d="M54 63.5 q6 6 12 0" fill="none" stroke="#232a4a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- P badge -->
  <circle cx="82" cy="49" r="4.6" fill="#ecbdcd"/>
  <text x="82" y="51.6" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="7" fill="#232a4a">P</text>

  <!-- wheels -->
  <circle cx="44" cy="87" r="7.5" fill="#232a4a" stroke="#fff" stroke-width="3"/>
  <circle cx="44" cy="87" r="2.8" fill="#ecbdcd"/>
  <circle cx="76" cy="87" r="7.5" fill="#232a4a" stroke="#fff" stroke-width="3"/>
  <circle cx="76" cy="87" r="2.8" fill="#ecbdcd"/>
</svg>
