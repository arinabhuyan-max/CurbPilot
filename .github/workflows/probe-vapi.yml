# Temporary: read the Vapi Web SDK and docs so the Parker voice code matches them.
name: Probe Vapi
on:
  push:
    branches: [claude/curbpilot-mvp-plan-3gv9y7]
    paths: [.github/workflows/probe-vapi.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: SDK package
        run: |
          set +e
          mkdir p && cd p && npm init -y >/dev/null && npm install @vapi-ai/web --no-audit --no-fund >/dev/null 2>&1
          V=$(node -p "require('@vapi-ai/web/package.json').version"); echo "VERSION $V"
          npm view @vapi-ai/web time --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s);console.log("published", t[process.argv[1]])})' "$V"
          node -p "'MAIN '+JSON.stringify({main:require('@vapi-ai/web/package.json').main,module:require('@vapi-ai/web/package.json').module,exports:require('@vapi-ai/web/package.json').exports})"
          node -e "const m=require('@vapi-ai/web'); console.log('KEYS', Object.keys(m), 'default', typeof m.default, 'proto', Object.getOwnPropertyNames((m.default||m).prototype||{}))"
          ls node_modules/@vapi-ai/web/dist
          echo '--- d.ts start/say/send/stop'; grep -nE '^\s*(start|stop|say|send|setMuted|isMuted|end)\(' node_modules/@vapi-ai/web/dist/vapi.d.ts | head -20
          echo '--- d.ts events'; grep -noE "'[a-z-]+'" node_modules/@vapi-ai/web/dist/vapi.d.ts | sort -u -t: -k3 | head -40
          echo '--- jsdelivr +esm'; curl -m 20 -s "https://cdn.jsdelivr.net/npm/@vapi-ai/web@$V/+esm" | head -c 400; echo; curl -m 20 -s -o /dev/null -w "jsdelivr %{http_code} %{size_download}\n" "https://cdn.jsdelivr.net/npm/@vapi-ai/web@$V/+esm"
          curl -m 20 -s -o /dev/null -w "esm.sh %{http_code} %{size_download}\n" "https://esm.sh/@vapi-ai/web@$V"
      - name: Docs
        run: |
          set +e
          get() { curl -m 20 -sL "$1"; }
          echo "=== web quickstart: temporary assistant"; get https://docs.vapi.ai/quickstart/web.md | grep -n -iE -A40 'temporary|transient|inline assistant|assistantOverrides' | head -120
          echo "=== custom tools: request/response + server field"; get https://docs.vapi.ai/tools/custom-tools.md | grep -n -iE -B2 -A30 'toolCallList|"results"|toolCallId|"server"' | head -160
          echo "=== server events: tool-calls"; get https://docs.vapi.ai/server-url/events.md | grep -n -iE -B3 -A30 'tool-calls' | head -100
          echo "=== llms.txt index (tools/web/client)"; get https://docs.vapi.ai/llms.txt | grep -iE 'client-side|tools|web' | head -30
