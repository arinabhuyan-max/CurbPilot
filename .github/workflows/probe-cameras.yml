# Temporary: inspect public NYC camera sources (Globe TV example page and the
# NYC DOT camera list it appears to use) so the camera feature is built on facts.
name: Probe camera sources
on:
  push:
    branches: [claude/curbpilot-mvp-plan-3gv9y7]
    paths: [.github/workflows/probe-cameras.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Globe TV example page
        run: |
          set +e
          URL=https://globetv.app/webcams/west-street-at-vestry-st-new-york-city-opencctv
          curl -m 30 -sSL -D headers.txt -o page.html "$URL"; echo "exit $?"
          echo "--- headers"; grep -iE '^(HTTP|content-type|x-frame-options|content-security-policy|server)' headers.txt
          echo "--- title/meta"; grep -oiE '<title>[^<]*</title>|<meta[^>]+(description|og:)[^>]+>' page.html | head -20
          echo "--- media-looking URLs"; grep -oE 'https?://[^"'"'"' <>\\]+' page.html | grep -iE 'jpg|jpeg|png|m3u8|mp4|image|cam|cctv|nyctmc|511|stream|embed' | sort -u | head -60
          echo "--- mentions"; grep -oiE '.{80}(nyctmc|opencctv|511ny|webcams\.nyc|dot\.nyc|camera id|cameraId).{80}' page.html | head -20
          echo "--- size"; wc -c page.html
          echo "--- next data"; grep -o '__NEXT_DATA__.\{0,3000\}' page.html | head -c 3000; echo
          echo "--- scripts"; grep -oE '<script[^>]+src="[^"]+"' page.html | head -20
      - name: NYC DOT camera list
        run: |
          set +e
          curl -m 30 -sS -D h2.txt -o cams.json https://webcams.nyctmc.org/api/cameras; echo "exit $?"
          grep -iE '^(HTTP|content-type|access-control|cache-control)' h2.txt
          echo "--- count"; jq 'length' cams.json
          echo "--- first"; jq '.[0]' cams.json
          echo "--- keys"; jq '[.[] | keys] | add | unique' cams.json
          echo "--- vestry"; jq '[.[] | select((.name // "") | test("Vestry"; "i"))]' cams.json
          echo "--- by area"; jq 'group_by(.area) | map({area: .[0].area, n: length})' cams.json
          echo "--- online"; jq 'group_by(.isOnline) | map({isOnline: .[0].isOnline, n: length})' cams.json
          echo "--- 28th st"; jq '[.[] | select((.name // "") | test("28"; "i"))] | .[0:5]' cams.json
          ID=$(jq -r '[.[] | select((.name // "") | test("Vestry"; "i"))][0].id // .[0].id' cams.json)
          IMG=$(jq -r --arg id "$ID" '.[] | select(.id == $id) | .imageUrl // empty' cams.json)
          [ -z "$IMG" ] && IMG="https://webcams.nyctmc.org/api/cameras/$ID/image"
          echo "--- image $IMG"; curl -m 30 -sS -D h3.txt -o img.bin "$IMG"; grep -iE '^(HTTP|content-type|content-length|cache-control|access-control)' h3.txt; file img.bin
          echo "--- site terms"; curl -m 30 -sSL https://webcams.nyctmc.org/ | grep -oiE '.{60}(terms|copyright|permission|commercial|disclaimer).{120}' | head -10
      - name: 511NY public camera list (no key)
        run: |
          set +e
          curl -m 30 -sS -o 511.html -w "%{http_code}\n" "https://511ny.org/map/Cctv/"; wc -c 511.html
