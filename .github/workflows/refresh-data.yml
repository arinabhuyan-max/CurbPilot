# Downloads NYC parking-sign data for all five boroughs, rebuilds data/curbs.json,
# refreshes the public NYC DOT camera list (data/cameras.json),
# and commits it. Vercel redeploys on the commit.
#
# Runs: when this file or the data scripts change on the CurbPilot branch,
# by hand (Actions tab -> Refresh NYC sign data -> Run workflow), and weekly.

name: Refresh NYC sign data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  push:
    branches: [claude/curbpilot-mvp-plan-3gv9y7]
    paths:
      - .github/workflows/refresh-data.yml
      - scripts/fetch-data.js
      - scripts/build-data.js
      - src/rules.js
      - src/config.js
      - src/data.js
      - scripts/fetch-cameras.js

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download signs from NYC Open Data
        run: npm run fetch-data

      - name: Build block faces
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npm install --no-audit --no-fund
            npm run build-data -- --ai
          else
            npm run build-data
          fi

      - name: Download public NYC DOT camera list
        # Cameras are a nice-to-have: never block the sign data refresh on them.
        continue-on-error: true
        run: |
          npm run fetch-cameras
          # Log whether camera images load when requested from the app's pages.
          ID=$(node -e 'const c=require("./data/cameras.json").cameras[0]; console.log(c[0])')
          curl -m 20 -s -o /dev/null -w "camera image with app referer: %{http_code} %{content_type}\n" \
            -H "Referer: https://curb-pilot.vercel.app/" "https://webcams.nyctmc.org/api/cameras/$ID/image"

      - name: Run tests
        run: npm test

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curbs.json
          [ -f data/cameras.json ] && git add data/cameras.json
          [ -f data/ai-rules-cache.json ] && git add data/ai-rules-cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh NYC sign data and camera list"
            git push
          fi
